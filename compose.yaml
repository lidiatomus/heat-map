name: solis-csi

services:
  csi:
    build:
      context: .
      dockerfile: Dockerfile
    image: solis-csi:latest
    restart: unless-stopped
    ports:
      - "${CSI_WEB_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Bucharest}
      CSI_DEFAULT_TRACK: ${CSI_DEFAULT_TRACK:-targu_mures}
      CSI_POLL_SECONDS: ${CSI_POLL_SECONDS:-2}
      CSI_STALE_AFTER_SECONDS: ${CSI_STALE_AFTER_SECONDS:-15}
      CSI_MAX_TRACK_DISTANCE_KM: ${CSI_MAX_TRACK_DISTANCE_KM:-10}
      CSI_COMPARISON_MAX_DISTANCE_KM: ${CSI_COMPARISON_MAX_DISTANCE_KM:-0.25}
      CSI_USE_LIVE_WEATHER: ${CSI_USE_LIVE_WEATHER:-true}
      INFLUXDB_URL: ${INFLUXDB_URL:?Set INFLUXDB_URL in .env}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      INFLUXDB_ORG: ${INFLUXDB_ORG:?Set INFLUXDB_ORG in .env}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?Set INFLUXDB_BUCKET in .env}
      INFLUXDB_MEASUREMENT: ${INFLUXDB_MEASUREMENT:-solar_vehicle}
      INFLUXDB_ECU: ${INFLUXDB_ECU:-VCU}
      INFLUXDB_LAT_FIELD: ${INFLUXDB_LAT_FIELD:-VCU_GPS_Latitude}
      INFLUXDB_LON_FIELD: ${INFLUXDB_LON_FIELD:-VCU_GPS_Longitude}
      INFLUXDB_LOOKBACK: ${INFLUXDB_LOOKBACK:-30s}
      INFLUXDB_TIMEOUT_MS: ${INFLUXDB_TIMEOUT_MS:-15000}
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - csi-cache:/app/cache

volumes:
  csi-cache:
